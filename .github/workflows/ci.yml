name: CI

# 离线翻译仅用 CPU；CPU 二进制随 npm 包自带，不下载未使用的 CUDA 组件。
env:
  ONNXRUNTIME_NODE_INSTALL: skip

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

# 端到端测试需要图形环境,不进常规 CI,由开发者本地运行(npm run test:e2e)。
